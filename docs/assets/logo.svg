<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#23233a"/>
      <stop offset="100%" stop-color="#101018"/>
    </radialGradient>
    <linearGradient id="ghostFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="62%" stop-color="#e9e9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b9b9f0" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- faint import arrow behind the ghost -->
  <g stroke="#6c6cf0" stroke-width="14" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M96 96 L96 150"/>
    <path d="M76 132 L96 152 L116 132"/>
  </g>
  <g stroke="#6c6cf0" stroke-width="14" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M416 362 L416 416"/>
    <path d="M396 398 L416 418 L436 398"/>
  </g>

  <!-- ghost body: fading fill + dashed outline (it doesn't really exist) -->
  <path d="M148 246
           C148 176 196 120 256 120
           C316 120 364 176 364 246
           L364 372
           C352 392 340 392 328 372
           C316 352 304 352 292 372
           C280 392 268 392 256 372
           C244 352 232 352 220 372
           C208 392 196 392 184 372
           C172 352 160 352 148 372
           Z"
        fill="url(#ghostFade)"
        stroke="#a5a5ff" stroke-width="9"
        stroke-dasharray="26 18" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="222" cy="248" rx="15" ry="24" fill="#14141f"/>
  <ellipse cx="290" cy="248" rx="15" ry="24" fill="#14141f"/>

  <!-- mouth: small "o" of surprise -->
  <circle cx="256" cy="300" r="11" fill="#14141f" opacity="0.85"/>
</svg>
