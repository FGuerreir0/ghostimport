name: 'ghostimport'
description: 'Find npm imports that do not exist — hallucinated by AI coding tools and free for attackers to register'
author: 'Fábio Guerreiro'

branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  path:
    description: 'Directory to scan (default: repo root)'
    required: false
    default: '.'
  fail-on-problems:
    description: 'Fail the step when a package does not exist on npm'
    required: false
    default: 'true'

outputs:
  missing:
    description: 'Number of imported packages that do not exist on npm'
  risks:
    description: 'Number of supply-chain findings'
  packages:
    description: 'Total unique packages checked'
  result:
    description: 'Full JSON result'

runs:
  using: 'composite'
  steps:
    - name: Run ghostimport
      id: scan
      shell: bash
      run: |
        set +e
        RESULT=$(npx ghostimport@latest "${{ inputs.path }}" --quiet --json 2>/dev/null)
        set -e

        MISSING=$(echo "$RESULT" | jq -r '.missing | length')
        RISKS=$(echo "$RESULT" | jq -r '.risks | length')
        PACKAGES=$(echo "$RESULT" | jq -r '.packages')

        echo "missing=$MISSING" >> $GITHUB_OUTPUT
        echo "risks=$RISKS" >> $GITHUB_OUTPUT
        echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

        # Write multiline JSON to output
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "result<<$EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

        # Summary
        if [ "$MISSING" -gt 0 ]; then
          echo "### 👻 ghostimport found $MISSING package(s) that do not exist on npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | jq '.missing' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.fail-on-problems }}" = "true" ]; then
            exit 1
          fi
        else
          echo "### ✅ ghostimport — all $PACKAGES packages exist on npm" >> $GITHUB_STEP_SUMMARY
        fi
